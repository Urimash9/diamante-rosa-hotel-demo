name: Materialize Diamante Rosa assets

on:
  push:
    branches:
      - build-03b-correcao-assets-layout
    paths:
      - .github/workflows/materialize-diamante-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    if: ${{ !contains(github.event.head_commit.message || '', '[assets-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: build-03b-correcao-assets-layout
          fetch-depth: 0

      - name: Download exact refined asset bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .asset-bundle public/assets/diamante-rosa/master
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://gcdn.picsart.com/editing-temp/f66cf001-cf77-4191-b2ee-fa8cc2a459b2.zip' \
            -o .asset-bundle/diamante_core_assets.zip
          unzip -o .asset-bundle/diamante_core_assets.zip -d public/assets/diamante-rosa/master

      - name: Write asset manifest
        shell: bash
        run: |
          cat > public/assets/diamante-rosa/ASSET_MANIFEST.md <<'EOF'
          # Diamante Rosa — assets locais oficiais da Build 03B

          Estes WebPs são o conjunto refinado aprovado para a Build 03B e ficam fisicamente no repositório. A Home não deve depender da galeria externa depois da integração.

          ## Masters locais
          - `master/facade.webp` — fachada/entrada; Hero e etapa Chegar.
          - `master/atrium.webp` — átrio/lobby; Receber bem, Respirar e apoio de Estrutura.
          - `master/room.webp` — quarto; Descansar e segunda configuração do carrossel.
          - `master/suite.webp` — suíte; slide principal do carrossel.
          - `master/jacuzzi.webp` — detalhe da acomodação; nunca tratar como categoria de quarto.
          - `master/breakfast.webp` — café da manhã; protagonista da seção Café e etapa Despertar. Usar crops distintos quando necessário.
          - `master/auditorium.webp` — auditório; protagonista de Estrutura e Serviços.
          - `master/lake.webp` — lago/entorno; Sentir que escolheu certo, Continuar e Localização.

          ## Regras
          1. Na Home, usar caminhos locais em `/assets/diamante-rosa/master/...`.
          2. Remover `photo(number)` e o `remotePatterns` exclusivo de `minas-gerais-hotels.com` quando não houver outro uso.
          3. Não substituir estes masters por screenshots de Instagram/Maps.
          4. Não inventar arquitetura, categorias de quartos ou serviços.
          5. Um mesmo master pode receber crops CSS diferentes quando o conteúdo semântico for o mesmo.
          6. Hero mobile pode usar `facade.webp` com `object-position`/crop próprios; não é obrigatório duplicar o arquivo.
          EOF

      - name: Validate local assets
        shell: bash
        run: |
          set -euo pipefail
          for file in facade.webp atrium.webp room.webp suite.webp jacuzzi.webp breakfast.webp auditorium.webp lake.webp; do
            test -s "public/assets/diamante-rosa/master/$file"
          done
          echo 'All approved Diamante Rosa assets are local and non-empty.'
          du -h public/assets/diamante-rosa/master/*

      - name: Commit local assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AVERO Studio Asset Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/diamante-rosa
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore: add approved refined local assets [assets-generated]'
          git push origin HEAD:build-03b-correcao-assets-layout
